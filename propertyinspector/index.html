<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #2d2d2d;
            color: #d8d8d8;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 9pt;
            padding: 8px 12px;
        }

        .section-label {
            color: #999;
            font-size: 8pt;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin: 14px 0 6px;
        }
        .section-label:first-child { margin-top: 10px; }

        .calendar-row {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 4px 2px;
            cursor: pointer;
            user-select: none;
        }

        .calendar-row input[type="checkbox"] {
            width: 13px;
            height: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .calendar-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hint {
            color: #777;
            font-size: 8pt;
            margin-top: 6px;
            font-style: italic;
        }

        .loading {
            color: #777;
            font-style: italic;
            margin-top: 6px;
        }

        select, input[type="text"], textarea {
            width: 100%;
            background: #3d3d3d;
            color: #d8d8d8;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 4px 6px;
            font: inherit;
        }
        input[type="text"], textarea, #otherApp { margin-top: 6px; }
        .hint:empty { display: none; }
        textarea { resize: vertical; }
        select:focus, input[type="text"]:focus, textarea:focus { outline: none; border-color: #888; }

        .drop-zone {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            padding: 8px;
            border: 1px dashed #666;
            border-radius: 4px;
        }
        .drop-zone.dragging { border-color: #9cf; background: #33404d; }
        .drop-zone img {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            background: #000;
            flex-shrink: 0;
            object-fit: contain;
        }
        .drop-zone img:not([src]) { visibility: hidden; }
        .indented { padding-left: 20px; }
        .disabled { opacity: 0.45; }
        input[type="time"] {
            background: #3d3d3d;
            color: #d8d8d8;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 1px 4px;
            font: inherit;
            color-scheme: dark;
        }
        .link { color: #9cf; cursor: pointer; text-decoration: underline; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="section-label">Show</div>
    <label class="calendar-row"><input type="checkbox" id="showEvents"> Calendar events</label>
    <div id="eventOptions" class="indented">
        <div id="list"><div class="loading">Loading calendars…</div></div>
        <div class="hint" id="hint"></div>
    </div>
    <label class="calendar-row"><input type="checkbox" id="showReminders"> Reminders due today</label>
    <div id="reminderOptions" class="indented hidden">
        <div id="reminderList"></div>
        <div class="hint" id="reminderHint"></div>
        <div class="hint">Hold the key, or tap it twice, to mark the reminder on it done.</div>
    </div>

    <div class="section-label">Timed and all-day</div>
    <label class="calendar-row"><input type="checkbox" id="showTimed"> At a set time, counting down</label>
    <label class="calendar-row"><input type="checkbox" id="showAllDay"> All day, when nothing timed is left today</label>
    <div id="allDayOptions" class="indented">
        <label class="calendar-row"><input type="checkbox" id="allDayCutoff"> Until <input type="time" id="allDayUntil" value="17:00"></label>
    </div>

    <div class="section-label">Alert sound</div>
    <label class="calendar-row"><input type="checkbox" id="playAlerts"> Play an alert before each event</label>
    <div id="alertOptions" class="indented">
        <label class="calendar-row"><input type="checkbox" class="alertMinute" value="60"> 1 hour before</label>
        <label class="calendar-row"><input type="checkbox" class="alertMinute" value="30"> 30 minutes before</label>
        <label class="calendar-row"><input type="checkbox" class="alertMinute" value="15"> 15 minutes before</label>
        <label class="calendar-row"><input type="checkbox" class="alertMinute" value="5"> 5 minutes before</label>
        <label class="calendar-row"><input type="checkbox" id="alertEveryMinute"> Every minute for the last 5 minutes</label>
    </div>

    <div class="section-label">When pressed, open</div>
    <select id="openApp"></select>
    <select id="otherApp" class="hidden"></select>
    <input id="openURL" type="text" class="hidden" placeholder="e.g. calendar.google.com" spellcheck="false">
    <div class="hint" id="openHint"></div>

    <div class="section-label">When there are no more events</div>
    <select id="noEventsStyle">
        <option value="moon">Moon phase</option>
        <option value="smile">Smiling calendar (light)</option>
        <option value="smile-dark">Smiling calendar (dark)</option>
        <option value="loop">Infinity clock (light)</option>
        <option value="loop-dark">Infinity clock (dark)</option>
        <option value="check">Checkmark Calendar</option>
        <option value="check-emoji">Checkmark ✅</option>
        <option value="thumbs">Thumbs up 👍</option>
        <option value="crescent">Crescent moon 🌙</option>
        <option value="text">Text only</option>
        <option value="message">Your own message…</option>
        <option value="custom">Your own image…</option>
    </select>
    <textarea id="noEventsMessage" class="hidden" rows="2" placeholder="What the key should say" spellcheck="true"></textarea>
    <div id="dropZone" class="drop-zone hidden">
        <img id="customPreview" alt="">
        <div>Drag an image here, or <span class="link" id="chooseImage">choose a file</span>.</div>
        <input id="imageFile" type="file" accept="image/*" class="hidden">
    </div>

    <script>
        // piUUID identifies this Property Inspector. Stream Deck requires it as the
        // "context" of every message the PI sends (sendToPlugin, setSettings) and
        // rejects messages that use the action instance's context instead.
        var ws, piUUID, actionID;
        var allCalendars = [];
        var reminderLists = [];
        var remindersAccess = 'notDetermined';   // granted | denied | notDetermined
        var reminderRetries = 0;
        var apps = [];          // installed suggestions: {id, name, group: 'calendar' | 'other', opens}
        var webCalendars = [];  // {id: 'web:…', name, opens}
        var allApps = [];       // every installed app, for "Another app…"
        var openChoice = null;  // OTHER_APP while the user is choosing from every app
        var retries = 0, MAX_RETRIES = 15;
        var KEY_IMAGE_SIZE = 144;   // keys are drawn at 144×144 px

        // All of this key's settings. setSettings replaces the whole object, so
        // every save sends every field.
        var settings = {
            selectedCalendars: [],      // empty means "all calendars"
            showEvents: true,           // calendar events
            showReminders: false,       // reminders due today
            selectedReminderLists: [],  // empty means "all lists"
            showTimed: true,            // events and reminders at a set time
            openApp: 'com.apple.iCal',  // a bundle ID, a 'web:' id, or 'url'
            openURL: '',
            noEventsStyle: 'moon',      // moon | smile | smile-dark | loop | loop-dark | check | check-emoji | thumbs | crescent | text | message | custom
            noEventsMessage: '',        // the key's text when noEventsStyle is 'message'
            noEventsImage: '',          // data: URL when noEventsStyle is 'custom'
            showAllDay: true,           // show all-day events when no timed event is left today
            allDayUntil: '',            // 'HH:MM' to stop showing them then; '' = all day
            playAlerts: true,
            alertMinutes: [60, 30, 15, 5],
            alertEveryMinute: false     // also alert at 4, 3, 2 and 1 minutes
        };
        var DEFAULT_CUTOFF = '17:00';

        function applySettings(s) {
            s = s || {};
            settings.showAllDay = s.showAllDay !== false;
            settings.allDayUntil = s.allDayUntil || '';
            settings.playAlerts = s.playAlerts !== false;
            settings.alertMinutes = Array.isArray(s.alertMinutes) ? s.alertMinutes : [60, 30, 15, 5];
            settings.alertEveryMinute = s.alertEveryMinute === true;
            settings.selectedCalendars = s.selectedCalendars || [];
            settings.showEvents = s.showEvents !== false;
            settings.showReminders = s.showReminders === true;
            settings.selectedReminderLists = s.selectedReminderLists || [];
            settings.showTimed = s.showTimed !== false;
            settings.openApp = s.openApp || 'com.apple.iCal';
            settings.openURL = s.openURL || '';
            settings.noEventsStyle = s.noEventsStyle || 'moon';
            settings.noEventsMessage = s.noEventsMessage || '';
            settings.noEventsImage = s.noEventsImage || '';
        }

        function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
            var actionInfo = JSON.parse(inActionInfo);
            piUUID   = inUUID;
            actionID = actionInfo.action;
            applySettings(actionInfo.payload && actionInfo.payload.settings);
            renderOpenApp();
            renderNoEvents();
            renderAllDay();
            renderAlerts();
            renderShow();

            ws = new WebSocket('ws://127.0.0.1:' + inPort);

            ws.onopen = function() {
                ws.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
                requestPanelData();
            };

            ws.onmessage = function(evt) {
                var msg = JSON.parse(evt.data);
                if (msg.event === 'sendToPropertyInspector' && msg.payload) {
                    if (msg.payload.apps) {
                        apps = msg.payload.apps;
                        webCalendars = msg.payload.webCalendars || [];
                        allApps = msg.payload.allApps || [];
                        renderOpenApp();
                    }
                    if (msg.payload.reminderLists) {
                        reminderLists = msg.payload.reminderLists;
                        remindersAccess = msg.payload.remindersAccess || 'notDetermined';
                        renderReminders();
                        // After Reminders is checked, wait for the answer to macOS's prompt.
                        if (settings.showReminders && remindersAccess === 'notDetermined' && reminderRetries < 30) {
                            reminderRetries++;
                            setTimeout(requestPanelData, 2000);
                        }
                    }
                    if (msg.payload.needsPermission) {
                        document.getElementById('list').innerHTML =
                            '<div class="loading">⚠️ Calendar access not granted.<br>' +
                            'Allow “StreamDeck Calendar Alerts” in System Settings → ' +
                            'Privacy &amp; Security → Calendars.</div>';
                        document.getElementById('hint').textContent = '';
                        return;
                    }
                    if (msg.payload.calendars) {
                        allCalendars = msg.payload.calendars;
                        // The helper may not have written the list yet (e.g. right
                        // after Stream Deck starts), so ask again for a little while.
                        if (allCalendars.length === 0 && retries < MAX_RETRIES) {
                            retries++;
                            setTimeout(requestPanelData, 2000);
                            return;
                        }
                        renderCalendars();
                    }
                } else if (msg.event === 'didReceiveSettings') {
                    applySettings(msg.payload && msg.payload.settings);
                    renderCalendars();
                    renderOpenApp();
                    renderNoEvents();
                    renderAllDay();
                    renderAlerts();
                    renderShow();
                    renderReminders();
                }
            };
        }

        // Ask the plugin for calendars, calendar apps, and permission status.
        function requestPanelData() {
            ws.send(JSON.stringify({
                event: 'sendToPlugin',
                action: actionID,
                context: piUUID,
                payload: { request: 'getPanelData' }
            }));
        }

        function save() {
            ws.send(JSON.stringify({
                event: 'setSettings',
                context: piUUID,
                payload: settings
            }));
        }

        // MARK: Calendars

        function renderCalendars() {
            renderCheckList(document.getElementById('list'), document.getElementById('hint'),
                            allCalendars, 'selectedCalendars', 'calendar', 'No calendars found.');
        }

        // A checkbox for each calendar or reminder list. The setting holds the
        // checked IDs, or nothing when every one is checked.
        function renderCheckList(list, hint, items, key, noun, emptyText) {
            list.innerHTML = '';

            function updateHint() {
                var selectedIDs = settings[key];
                if (selectedIDs.length === 0) {
                    hint.textContent = items.length ? 'All ' + noun + 's shown' : '';
                    return;
                }
                // Don't count saved IDs of ones that have since been deleted.
                var count = items.filter(function(c) { return selectedIDs.indexOf(c.id) !== -1; }).length;
                hint.textContent = count + ' ' + noun + (count !== 1 ? 's' : '') + ' selected';
            }

            if (items.length === 0) {
                list.innerHTML = '<div class="loading">' + emptyText + '</div>';
                updateHint();
                return;
            }

            var selectedIDs = settings[key];
            items.forEach(function(cal) {
                var isChecked = selectedIDs.length === 0 || selectedIDs.indexOf(cal.id) !== -1;

                var row = document.createElement('label');
                row.className = 'calendar-row';

                var cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = isChecked;
                cb.addEventListener('change', function() {
                    // An empty list means "all", so expand it to the full set of
                    // IDs before adding or removing one.
                    var current = settings[key].length === 0
                        ? items.map(function(c) { return c.id; })
                        : settings[key].slice();

                    if (cb.checked) {
                        if (current.indexOf(cal.id) === -1) current.push(cal.id);
                    } else {
                        current = current.filter(function(id) { return id !== cal.id; });
                    }

                    // Keep at least one checked: an empty list would be saved as
                    // "all", the opposite of what the user asked for.
                    var anyChecked = items.some(function(c) { return current.indexOf(c.id) !== -1; });
                    if (!anyChecked) {
                        cb.checked = true;
                        return;
                    }

                    // Store an empty array when everything is checked (means "all").
                    var allChecked = items.every(function(c) { return current.indexOf(c.id) !== -1; });
                    settings[key] = allChecked ? [] : current;
                    save();
                    updateHint();
                });

                var dot = document.createElement('div');
                dot.className = 'dot';
                dot.style.backgroundColor = cal.color || '#888';

                var name = document.createElement('span');
                name.className = 'calendar-name';
                name.textContent = cal.title;

                row.appendChild(cb);
                row.appendChild(dot);
                row.appendChild(name);
                list.appendChild(row);
            });

            updateHint();
        }

        // MARK: Events, reminders, timed and all-day

        function renderShow() {
            document.getElementById('showEvents').checked = settings.showEvents;
            document.getElementById('eventOptions').classList.toggle('hidden', !settings.showEvents);
            document.getElementById('showReminders').checked = settings.showReminders;
            document.getElementById('reminderOptions').classList.toggle('hidden', !settings.showReminders);
            document.getElementById('showTimed').checked = settings.showTimed;
        }

        function renderReminders() {
            var list = document.getElementById('reminderList');
            var hint = document.getElementById('reminderHint');
            if (remindersAccess === 'denied') {
                list.innerHTML = '<div class="loading">⚠️ Reminders access not granted.<br>' +
                    'Allow “StreamDeck Calendar Alerts” in System Settings → ' +
                    'Privacy &amp; Security → Reminders.</div>';
                hint.textContent = '';
                return;
            }
            if (remindersAccess !== 'granted') {
                list.innerHTML = '<div class="loading">Waiting for access to Reminders…</div>';
                hint.textContent = '';
                return;
            }
            renderCheckList(list, hint, reminderLists, 'selectedReminderLists', 'list', 'No reminder lists found.');
        }

        document.getElementById('showEvents').addEventListener('change', function(e) {
            settings.showEvents = e.target.checked;
            renderShow();
            save();
        });
        document.getElementById('showReminders').addEventListener('change', function(e) {
            settings.showReminders = e.target.checked;
            renderShow();
            save();
            if (settings.showReminders) {
                ws.send(JSON.stringify({
                    event: 'sendToPlugin', action: actionID, context: piUUID,
                    payload: { request: 'requestReminders' }
                }));
                reminderRetries = 0;
                setTimeout(requestPanelData, 1000);
            }
        });
        document.getElementById('showTimed').addEventListener('change', function(e) {
            settings.showTimed = e.target.checked;
            save();
        });

        // MARK: All-day events

        function renderAllDay() {
            var show = document.getElementById('showAllDay');
            var cutoff = document.getElementById('allDayCutoff');
            var time = document.getElementById('allDayUntil');
            show.checked = settings.showAllDay;
            cutoff.checked = settings.allDayUntil !== '';
            if (settings.allDayUntil) time.value = settings.allDayUntil;
            cutoff.disabled = time.disabled = !settings.showAllDay;
            document.getElementById('allDayOptions').classList.toggle('disabled', !settings.showAllDay);
        }

        document.getElementById('showAllDay').addEventListener('change', function(e) {
            settings.showAllDay = e.target.checked;
            renderAllDay();
            save();
        });
        document.getElementById('allDayCutoff').addEventListener('change', function(e) {
            settings.allDayUntil = e.target.checked
                ? (document.getElementById('allDayUntil').value || DEFAULT_CUTOFF) : '';
            renderAllDay();
            save();
        });
        document.getElementById('allDayUntil').addEventListener('change', function(e) {
            // Picking a time turns the cut-off on.
            if (!e.target.value) return;
            settings.allDayUntil = e.target.value;
            renderAllDay();
            save();
        });

        // MARK: Alert sound

        function renderAlerts() {
            document.getElementById('playAlerts').checked = settings.playAlerts;
            Array.prototype.forEach.call(document.querySelectorAll('.alertMinute'), function(cb) {
                cb.checked = settings.alertMinutes.indexOf(Number(cb.value)) !== -1;
                cb.disabled = !settings.playAlerts;
            });
            var every = document.getElementById('alertEveryMinute');
            every.checked = settings.alertEveryMinute;
            every.disabled = !settings.playAlerts;
            document.getElementById('alertOptions').classList.toggle('disabled', !settings.playAlerts);
        }

        document.getElementById('playAlerts').addEventListener('change', function(e) {
            settings.playAlerts = e.target.checked;
            renderAlerts();
            save();
        });
        Array.prototype.forEach.call(document.querySelectorAll('.alertMinute'), function(cb) {
            cb.addEventListener('change', function() {
                var minutes = Number(cb.value);
                var list = settings.alertMinutes.filter(function(m) { return m !== minutes; });
                if (cb.checked) list.push(minutes);
                settings.alertMinutes = list.sort(function(a, b) { return b - a; });
                save();
            });
        });
        document.getElementById('alertEveryMinute').addEventListener('change', function(e) {
            settings.alertEveryMinute = e.target.checked;
            save();
        });

        // MARK: App to open
        //
        // The menu lists installed calendar apps, installed meeting and task apps,
        // web calendars, then "Another app…" (a second list of every installed
        // app) and "Web page or URL…". The saved setting is just the choice's id:
        // a bundle ID, a "web:" id, or "url".

        var OTHER_APP = '__other';

        function addOptions(parent, items) {
            items.forEach(function(item) {
                var option = document.createElement('option');
                option.value = item.id;
                option.textContent = item.name;
                parent.appendChild(option);
            });
        }

        function addGroup(select, label, items) {
            if (!items.length) return;
            var group = document.createElement('optgroup');
            group.label = label;
            addOptions(group, items);
            select.appendChild(group);
        }

        function findChoice(id) {
            return apps.concat(webCalendars, allApps).find(function(a) { return a.id === id; });
        }

        // The menu entry that matches the saved setting.
        function currentOpenChoice() {
            if (settings.openApp === 'url') return 'url';
            if (openChoice === OTHER_APP) return OTHER_APP;
            var listed = apps.concat(webCalendars).some(function(a) { return a.id === settings.openApp; });
            if (listed) return settings.openApp;
            // Before the plugin's app list arrives, the default still shows as Calendar.
            if (!apps.length && settings.openApp === 'com.apple.iCal') return settings.openApp;
            return OTHER_APP;
        }

        function renderOpenApp() {
            var select = document.getElementById('openApp');
            select.innerHTML = '';
            var calendars = apps.filter(function(a) { return a.group === 'calendar'; });
            if (!apps.length) calendars = [{ id: 'com.apple.iCal', name: 'Calendar' }];
            addGroup(select, 'Calendar apps', calendars);
            addGroup(select, 'Meetings and tasks', apps.filter(function(a) { return a.group === 'other'; }));
            addGroup(select, 'On the web', webCalendars);
            addGroup(select, 'Other', [
                { id: OTHER_APP, name: 'Another app…' },
                { id: 'url', name: 'Web page or URL…' }
            ]);
            var choice = currentOpenChoice();
            select.value = choice;

            // "Another app…": every installed app.
            var other = document.getElementById('otherApp');
            other.innerHTML = '';
            var placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = 'Choose an app…';
            placeholder.disabled = true;
            other.appendChild(placeholder);
            var everyApp = allApps.slice();
            var saved = settings.openApp;
            var savedIsApp = saved !== 'url' && saved.indexOf('web:') !== 0;
            if (choice === OTHER_APP && savedIsApp && allApps.length &&
                !everyApp.some(function(a) { return a.id === saved; })) {
                // Keep a saved app that's no longer installed visible, so the
                // setting doesn't silently change.
                everyApp.unshift({ id: saved, name: saved + ' (not found)' });
            }
            addOptions(other, everyApp);
            var pickedOther = choice === OTHER_APP && everyApp.some(function(a) { return a.id === saved; });
            other.value = pickedOther ? saved : '';
            other.classList.toggle('hidden', choice !== OTHER_APP);

            var urlField = document.getElementById('openURL');
            urlField.value = settings.openURL;
            urlField.classList.toggle('hidden', choice !== 'url');

            // Say what a press will show, for apps that can show the event.
            var app = (choice === 'url' || (choice === OTHER_APP && !pickedOther)) ? null : findChoice(saved);
            var hint = '';
            if (app && app.opens === 'event') hint = 'Opens the event shown on the key.';
            if (app && app.opens === 'day') hint = 'Opens the day of the event shown on the key.';
            document.getElementById('openHint').textContent = hint;
        }

        document.getElementById('openApp').addEventListener('change', function(e) {
            var value = e.target.value;
            if (value === OTHER_APP) {
                // Nothing to save until an app is picked from the second list.
                openChoice = OTHER_APP;
                renderOpenApp();
                document.getElementById('otherApp').focus();
                return;
            }
            openChoice = null;
            settings.openApp = value;
            save();
            renderOpenApp();
            if (value === 'url') document.getElementById('openURL').focus();
        });

        document.getElementById('otherApp').addEventListener('change', function(e) {
            settings.openApp = e.target.value;
            save();
            renderOpenApp();
        });

        document.getElementById('openURL').addEventListener('change', function(e) {
            settings.openURL = e.target.value.trim();
            save();
        });

        // MARK: No-events image

        function renderNoEvents() {
            document.getElementById('noEventsStyle').value = settings.noEventsStyle;
            document.getElementById('dropZone').classList.toggle('hidden', settings.noEventsStyle !== 'custom');
            var messageField = document.getElementById('noEventsMessage');
            messageField.classList.toggle('hidden', settings.noEventsStyle !== 'message');
            // Don't overwrite what the user is in the middle of typing.
            if (document.activeElement !== messageField) messageField.value = settings.noEventsMessage;
            var preview = document.getElementById('customPreview');
            if (settings.noEventsImage) {
                preview.src = settings.noEventsImage;
            } else {
                preview.removeAttribute('src');
            }
        }

        document.getElementById('noEventsStyle').addEventListener('change', function(e) {
            settings.noEventsStyle = e.target.value;
            renderNoEvents();
            save();
            if (settings.noEventsStyle === 'message') document.getElementById('noEventsMessage').focus();
        });

        // Save the message shortly after typing pauses, so the key updates as you type.
        var messageTimer = null;
        document.getElementById('noEventsMessage').addEventListener('input', function(e) {
            settings.noEventsMessage = e.target.value;
            clearTimeout(messageTimer);
            messageTimer = setTimeout(save, 400);
        });

        var dropZone = document.getElementById('dropZone');
        ['dragenter', 'dragover'].forEach(function(type) {
            dropZone.addEventListener(type, function(e) {
                e.preventDefault();
                dropZone.classList.add('dragging');
            });
        });
        ['dragleave', 'drop'].forEach(function(type) {
            dropZone.addEventListener(type, function(e) {
                e.preventDefault();
                dropZone.classList.remove('dragging');
            });
        });
        dropZone.addEventListener('drop', function(e) {
            var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if (file) useImageFile(file);
        });

        document.getElementById('chooseImage').addEventListener('click', function() {
            document.getElementById('imageFile').click();
        });
        document.getElementById('imageFile').addEventListener('change', function(e) {
            if (e.target.files[0]) useImageFile(e.target.files[0]);
            e.target.value = '';
        });

        // Scale the image to fit a key (keeping its proportions) and store it in
        // the key's settings as a PNG data: URL.
        function useImageFile(file) {
            if (!/^image\//.test(file.type)) return;
            var reader = new FileReader();
            reader.onload = function() {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas');
                    canvas.width = canvas.height = KEY_IMAGE_SIZE;
                    var ctx = canvas.getContext('2d');
                    var scale = Math.min(KEY_IMAGE_SIZE / img.width, KEY_IMAGE_SIZE / img.height);
                    var w = img.width * scale, h = img.height * scale;
                    ctx.drawImage(img, (KEY_IMAGE_SIZE - w) / 2, (KEY_IMAGE_SIZE - h) / 2, w, h);
                    settings.noEventsImage = canvas.toDataURL('image/png');
                    settings.noEventsStyle = 'custom';
                    renderNoEvents();
                    save();
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
