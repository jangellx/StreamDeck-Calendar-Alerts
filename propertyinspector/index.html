<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #2d2d2d;
            color: #d8d8d8;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 9pt;
            padding: 8px 12px;
        }

        .section-label {
            color: #999;
            font-size: 8pt;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin: 10px 0 6px;
        }

        .calendar-row {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 4px 2px;
            cursor: pointer;
            user-select: none;
        }

        .calendar-row input[type="checkbox"] {
            width: 13px;
            height: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .calendar-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hint {
            color: #777;
            font-size: 8pt;
            margin-top: 10px;
            font-style: italic;
        }

        .loading {
            color: #777;
            font-style: italic;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="section-label">Show events from</div>
    <div id="list"><div class="loading">Loading calendars…</div></div>
    <div class="hint" id="hint"></div>

    <script>
        // piUUID identifies this Property Inspector. Stream Deck requires it as the
        // "context" of every message the PI sends (sendToPlugin, setSettings) and
        // rejects messages that use the action instance's context instead.
        var ws, piUUID, actionID;
        var allCalendars = [];
        var selectedIDs = [];
        var retries = 0, MAX_RETRIES = 15;

        // Ask the plugin for the current calendar list.
        function requestCalendars() {
            ws.send(JSON.stringify({
                event: 'sendToPlugin',
                action: actionID,
                context: piUUID,
                payload: { request: 'getCalendars' }
            }));
        }

        function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
            var actionInfo = JSON.parse(inActionInfo);
            piUUID    = inUUID;
            actionID  = actionInfo.action;

            var settings = (actionInfo.payload && actionInfo.payload.settings) || {};
            selectedIDs = settings.selectedCalendars || [];

            ws = new WebSocket('ws://127.0.0.1:' + inPort);

            ws.onopen = function() {
                ws.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
                requestCalendars();
            };

            ws.onmessage = function(evt) {
                var msg = JSON.parse(evt.data);
                if (msg.event === 'sendToPropertyInspector' && msg.payload) {
                    if (msg.payload.needsPermission) {
                        document.getElementById('list').innerHTML =
                            '<div class="loading">⚠️ Calendar access not granted.<br>' +
                            'Allow “StreamDeck Calendar Alerts” in System Settings → ' +
                            'Privacy &amp; Security → Calendars.</div>';
                        document.getElementById('hint').textContent = '';
                        return;
                    }
                    if (msg.payload.calendars) {
                        allCalendars = msg.payload.calendars;
                        // The helper may not have written the list yet (e.g. right
                        // after Stream Deck starts), so ask again for a little while.
                        if (allCalendars.length === 0 && retries < MAX_RETRIES) {
                            retries++;
                            setTimeout(requestCalendars, 2000);
                            return;
                        }
                        render();
                    }
                } else if (msg.event === 'didReceiveSettings') {
                    var s = msg.payload && msg.payload.settings || {};
                    selectedIDs = s.selectedCalendars || [];
                    render();
                }
            };
        }

        function render() {
            var list = document.getElementById('list');
            list.innerHTML = '';

            if (allCalendars.length === 0) {
                list.innerHTML = '<div class="loading">No calendars found.</div>';
                updateHint();
                return;
            }

            allCalendars.forEach(function(cal) {
                var isChecked = selectedIDs.length === 0 || selectedIDs.indexOf(cal.id) !== -1;

                var row = document.createElement('label');
                row.className = 'calendar-row';

                var cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = isChecked;
                cb.addEventListener('change', function() {
                    // An empty list means "all calendars", so expand it to the
                    // full set of IDs before adding or removing one.
                    var current = selectedIDs.length === 0
                        ? allCalendars.map(function(c) { return c.id; })
                        : selectedIDs.slice();

                    if (cb.checked) {
                        if (current.indexOf(cal.id) === -1) current.push(cal.id);
                    } else {
                        current = current.filter(function(id) { return id !== cal.id; });
                    }

                    // Keep at least one calendar checked: an empty list would be
                    // saved as "all", the opposite of what the user asked for.
                    var anyChecked = allCalendars.some(function(c) {
                        return current.indexOf(c.id) !== -1;
                    });
                    if (!anyChecked) {
                        cb.checked = true;
                        return;
                    }

                    // Store empty array when everything is checked (means "all").
                    var allChecked = allCalendars.every(function(c) {
                        return current.indexOf(c.id) !== -1;
                    });
                    save(allChecked ? [] : current);
                });

                var dot = document.createElement('div');
                dot.className = 'dot';
                dot.style.backgroundColor = cal.color || '#888';

                var name = document.createElement('span');
                name.className = 'calendar-name';
                name.textContent = cal.title;

                row.appendChild(cb);
                row.appendChild(dot);
                row.appendChild(name);
                list.appendChild(row);
            });

            updateHint();
        }

        function save(ids) {
            selectedIDs = ids;
            ws.send(JSON.stringify({
                event: 'setSettings',
                context: piUUID,
                payload: { selectedCalendars: ids }
            }));
            updateHint();
        }

        function updateHint() {
            var hint = document.getElementById('hint');
            if (selectedIDs.length === 0) {
                hint.textContent = 'All calendars shown';
                return;
            }
            // Don't count saved IDs of calendars that have since been deleted.
            var count = allCalendars.filter(function(c) {
                return selectedIDs.indexOf(c.id) !== -1;
            }).length;
            hint.textContent = count + ' calendar' + (count !== 1 ? 's' : '') + ' selected';
        }
    </script>
</body>
</html>
